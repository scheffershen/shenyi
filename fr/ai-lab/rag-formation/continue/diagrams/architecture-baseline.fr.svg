<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-baseline.fr-title architecture-baseline.fr-desc">
      <title id="architecture-baseline.fr-title">La base v0.2.2</title>
      <desc id="architecture-baseline.fr-desc">Diagramme d'architecture montrant les documents découpés et résumés, envoyés vers quatre canaux de recherche en parallèle, fusionnés dans un contexte budgété, jusqu'à une génération fondée avec citations ; la capture de retour et la gestion des relances sont marquées comme hors périmètre pour cette base.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.10"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45536b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#047857"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f5fa"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows first (behind boxes) -->
      <line x1="440" y1="88" x2="440" y2="128" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="194" y1="184" x2="194" y2="252" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="358" y1="184" x2="358" y2="252" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="522" y1="184" x2="522" y2="252" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="686" y1="184" x2="686" y2="252" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="194" y1="316" x2="194" y2="380" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="358" y1="316" x2="358" y2="380" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="522" y1="316" x2="522" y2="380" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="686" y1="316" x2="686" y2="380" stroke="#45536b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="440" y1="436" x2="440" y2="492" stroke="#047857" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Node: Documents (input) -->
      <rect x="340" y="40" width="200" height="48" rx="6" fill="#f2f5fa"/>
      <rect x="340" y="40" width="200" height="48" rx="6" fill="#45536b" fill-opacity="0.10" stroke="#5b6b84" stroke-width="1"/>
      <text x="440" y="68" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Documents</text>

      <!-- Node: Chunk + summarize (wide bar) -->
      <rect x="124" y="128" width="632" height="56" rx="6" fill="#f2f5fa"/>
      <rect x="124" y="128" width="632" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="440" y="160" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Découpage + résumé</text>

      <!-- Nodes: 4 retrieval channels -->
      <rect x="124" y="252" width="140" height="64" rx="6" fill="#f2f5fa"/>
      <rect x="124" y="252" width="140" height="64" rx="6" fill="#0f172a" fill-opacity="0.05" stroke="#45536b" stroke-width="1"/>
      <text x="194" y="280" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Vecteur fragment</text>
      <text x="194" y="296" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">reformulation, sens</text>

      <rect x="288" y="252" width="140" height="64" rx="6" fill="#f2f5fa"/>
      <rect x="288" y="252" width="140" height="64" rx="6" fill="#0f172a" fill-opacity="0.05" stroke="#45536b" stroke-width="1"/>
      <text x="358" y="280" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Vecteur résumé</text>
      <text x="358" y="296" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">quel document, en gros</text>

      <rect x="452" y="252" width="140" height="64" rx="6" fill="#f2f5fa"/>
      <rect x="452" y="252" width="140" height="64" rx="6" fill="#0f172a" fill-opacity="0.05" stroke="#45536b" stroke-width="1"/>
      <text x="522" y="280" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Plein texte</text>
      <text x="522" y="296" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">codes exacts, noms</text>

      <rect x="616" y="252" width="140" height="64" rx="6" fill="#f2f5fa"/>
      <rect x="616" y="252" width="140" height="64" rx="6" fill="#0f172a" fill-opacity="0.05" stroke="#45536b" stroke-width="1"/>
      <text x="686" y="280" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Graphe</text>
      <text x="686" y="296" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">relations multi-sauts</text>

      <!-- Node: Merge (wide bar) -->
      <rect x="124" y="380" width="632" height="56" rx="6" fill="#f2f5fa"/>
      <rect x="124" y="380" width="632" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="440" y="412" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Fusion, dédoublonnage, budget</text>

      <!-- Node: Generate + cite (focal) -->
      <rect x="320" y="492" width="240" height="56" rx="6" fill="#f2f5fa"/>
      <rect x="320" y="492" width="240" height="56" rx="6" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-width="1.2"/>
      <text x="440" y="516" fill="#047857" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Génération + citation</text>
      <text x="440" y="532" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">strictement le contexte, ou refus</text>

      <!-- Node: out of scope (optional treatment, no connector) -->
      <rect x="680" y="40" width="160" height="64" rx="6" fill="#0f172a" fill-opacity="0.02" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="66" fill="#45536b" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pas encore</text>
      <text x="760" y="80" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">retour +</text>
      <text x="760" y="92" fill="#45536b" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">relances</text>

      <!-- Legend strip -->
      <line x1="40" y1="588" x2="840" y2="588" stroke="#0f172a" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="604" fill="#45536b" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">LÉGENDE</text>

      <rect x="40" y="620" width="14" height="10" rx="2" fill="#45536b" fill-opacity="0.10" stroke="#5b6b84" stroke-width="1"/>
      <text x="60" y="628" fill="#45536b" font-size="8.5" font-family="'Inter', sans-serif">Entrée</text>

      <rect x="140" y="620" width="14" height="10" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="160" y="628" fill="#45536b" font-size="8.5" font-family="'Inter', sans-serif">Étape de traitement</text>

      <rect x="290" y="620" width="14" height="10" rx="2" fill="#0f172a" fill-opacity="0.05" stroke="#45536b" stroke-width="1"/>
      <text x="310" y="628" fill="#45536b" font-size="8.5" font-family="'Inter', sans-serif">Canal de recherche</text>

      <rect x="440" y="620" width="14" height="10" rx="2" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-width="1.2"/>
      <text x="460" y="628" fill="#45536b" font-size="8.5" font-family="'Inter', sans-serif">Focal</text>

      <rect x="520" y="620" width="14" height="10" rx="2" fill="#0f172a" fill-opacity="0.02" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="540" y="628" fill="#45536b" font-size="8.5" font-family="'Inter', sans-serif">Volontairement pas construit</text>
    </svg>
