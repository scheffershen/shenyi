<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-context-window.zh-title layers-context-window.zh-desc">
      <title id="layers-context-window.zh-title">更大的上下文窗口解决不了什么</title>
      <desc id="layers-context-window.zh-desc">分层堆叠图展示大上下文窗口只能到达最上面的"塞得进去吗"这一层，而成本与延迟、访问控制、时效性和可追溯性仍然是检索的工作；最上面这一层被标注为上下文真正解决的那一层。</desc>
        <defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@500;600&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap');</style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.10"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f2f5fa"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="52" y="70" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif">上下文能到达</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="#0f172a" stroke-opacity="0.30" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#45536b"/>
        <text x="60" y="418" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif">仍需检索</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1"/>

        <!-- L5 — 塞得进去吗 (top layer, FOCAL) -->
        <rect x="120" y="80" width="840" height="64" fill="#047857" fill-opacity="0.08"/>
        <rect x="120" y="80" width="840" height="64" fill="none" stroke="#047857" stroke-width="1"/>
        <text x="140" y="116" fill="#047857" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" font-weight="600">L5</text>
        <text x="260" y="119" fill="#0f172a" font-size="17" font-weight="600" font-family="'Inter','Noto Sans SC',sans-serif">塞得进去吗</text>
        <text x="940" y="119" fill="#047857" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif" text-anchor="end">百万级 token 窗口回答的是这个</text>

        <!-- L4 — 每次请求的成本与延迟 -->
        <rect x="120" y="144" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="208" x2="960" y2="208" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="180" fill="#45536b" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">L4</text>
        <text x="260" y="183" fill="#0f172a" font-size="17" font-weight="600" font-family="'Inter','Noto Sans SC',sans-serif">每次请求的成本与延迟</text>
        <text x="940" y="183" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif" text-anchor="end">每次都重新读一遍</text>

        <!-- L3 — 访问控制 -->
        <rect x="120" y="208" width="840" height="64" fill="#eef1f6"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="244" fill="#45536b" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="247" fill="#0f172a" font-size="17" font-weight="600" font-family="'Inter','Noto Sans SC',sans-serif">访问控制</text>
        <text x="940" y="247" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif" text-anchor="end">谁有权看哪份文档</text>

        <!-- L2 — 时效性 -->
        <rect x="120" y="272" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="308" fill="#45536b" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="311" fill="#0f172a" font-size="17" font-weight="600" font-family="'Inter','Noto Sans SC',sans-serif">时效性</text>
        <text x="940" y="311" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif" text-anchor="end">重新索引一份文档，而不是全部</text>

        <!-- L1 — 可追溯性 (bottom) -->
        <rect x="120" y="336" width="840" height="64" fill="#eef1f6"/>
        <text x="140" y="372" fill="#45536b" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="375" fill="#0f172a" font-size="17" font-weight="600" font-family="'Inter','Noto Sans SC',sans-serif">可追溯性</text>
        <text x="940" y="375" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif" text-anchor="end">证明是哪份文档，引用在这里</text>

        <!-- Caption -->
        <text x="120" y="457" fill="#45536b" font-size="12" font-weight="500" font-family="'Inter','Noto Sans SC',sans-serif">重点层</text>
        <text x="200" y="457" fill="#45536b" font-size="12" font-family="'Inter','Noto Sans SC',sans-serif" font-style="italic">更大的上下文窗口永远只能到达最上面这一层。下面四层不是上下文大小的问题——它们正是检索存在的意义。</text>
      </svg>
