<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Yi Shen — Senior Full-Stack &amp; AI Solutions Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- brand -->
  <rect x="80" y="72" width="60" height="60" rx="15" fill="url(#mark)"/>
  <text x="110" y="113" text-anchor="middle" font-family="JetBrains Mono, monospace"
        font-size="27" font-weight="700" fill="#05231a">YS</text>
  <text x="160" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="700" fill="#e8eefa">Yi Shen</text>
  <text x="160" y="123" font-family="JetBrains Mono, monospace"
        font-size="14" fill="#6b7d99" letter-spacing="1.6">FULL-STACK &amp; AI</text>

  <!-- headline -->
  <text x="80" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#e8eefa" letter-spacing="-2">Senior <tspan fill="#34d399">Full-Stack &amp; AI</tspan></text>
  <text x="80" y="326" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#e8eefa" letter-spacing="-2">Solutions Developer</text>

  <text x="80" y="384" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25" fill="#93a4bf">25+ years building enterprise systems.</text>

  <!-- capability chips -->
  <g font-family="JetBrains Mono, monospace" font-size="16" fill="#c3cfe2">
    <rect x="80"  y="432" width="176" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="168" y="460" text-anchor="middle">Symfony / PHP</text>

    <rect x="272" y="432" width="150" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="347" y="460" text-anchor="middle">RAG Engines</text>

    <rect x="438" y="432" width="150" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="513" y="460" text-anchor="middle">AI Agents</text>

    <rect x="604" y="432" width="196" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="702" y="460" text-anchor="middle">Knowledge Graphs</text>
  </g>

  <!-- footer strip -->
  <rect x="80" y="533" width="1040" height="1" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="87" cy="577" r="5" fill="#34d399"/>
  <text x="103" y="583" font-family="JetBrains Mono, monospace" font-size="17" fill="#93a4bf">
    Paris · Singapore · Shanghai
  </text>
  <text x="1120" y="583" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="17" fill="#6b7d99">
    FR · ZH · EN
  </text>
  <rect x="80" y="612" width="150" height="4" rx="2" fill="url(#accent)"/>
</svg>
