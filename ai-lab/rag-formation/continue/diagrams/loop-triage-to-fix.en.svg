<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-triage-to-fix.en-title loop-triage-to-fix.en-desc">
      <title id="loop-triage-to-fix.en-title">From triage to fix</title>
      <desc id="loop-triage-to-fix.en-desc">Six stations flow clockwise from flagged negative feedback through LLM triage, a scoped coding-agent fix, and a regression test, to shipping and re-running triage on a fresh batch, all writing back to one shared interaction log, with the coding-agent step highlighted as the reviewed gate.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
        .ring { fill: none; stroke: #45536b; stroke-width: 1.2; }
        .spoke { fill: none; stroke: #5b6b84; stroke-width: 1; stroke-dasharray: 5 4; }
        .station { fill: #f2f5fa; stroke: #0f172a; stroke-width: 1; }
        .station.focal { fill: rgba(4,120,87,0.08); stroke: #047857; stroke-width: 1.2; }
        .hub { fill: #0f172a; }
        .node-name { fill: #0f172a; font: 600 12px 'Inter', sans-serif; text-anchor: middle; }
        .focal-name { fill: #047857; }
        .sublabel { fill: #5b6b84; font: 400 8px 'JetBrains Mono', monospace; text-anchor: middle; }
        .hub-name { fill: #f2f5fa; font: 600 16px 'Inter', sans-serif; text-anchor: middle; }
        .hub-sub { fill: #f2f5fa; opacity: 0.72; font: 400 8px 'JetBrains Mono', monospace; text-anchor: middle; }
        .arrow-label { fill: #5b6b84; font: 400 8px 'JetBrains Mono', monospace; letter-spacing: 0.06em; text-anchor: middle; }
      </style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.10"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#45536b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#047857"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6b84"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#f2f5fa"/>
      <rect width="1040" height="680" fill="url(#dots)" opacity="0.55"/>

      <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

      <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#arrow-soft)"/>

      <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
      <rect x="524" y="200" width="40" height="16" rx="4" fill="#f2f5fa"/>
      <text x="544" y="212" class="arrow-label">READ</text>
      <rect x="452" y="464" width="68" height="16" rx="4" fill="#f2f5fa"/>
      <text x="486" y="476" class="arrow-label">RECOUNT</text>

      <!-- Stations -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name">Negative feedback</text><text x="520" y="116" class="sublabel">flagged interactions</text>

      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Triage</text><text x="728" y="236" class="sublabel">LLM sorts into categories</text>

      <rect class="station focal" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name focal-name">Coding agent</text><text x="728" y="476" class="sublabel">Claude Code or Codex</text>

      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name">Regression test</text><text x="520" y="596" class="sublabel">built from the real case</text>

      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name">Ship the fix</text><text x="312" y="476" class="sublabel">one category, one layer</text>

      <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Fresh batch</text><text x="312" y="236" class="sublabel">same prompt, new logs</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Interaction log</text>
      <text x="520" y="360" class="hub-sub">every query, answer, feedback</text>
    </svg>
